name: Apply site audit cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply service positioning cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          replacements = {
              'Prime Growth PK helps businesses grow through web development, SEO, AI automation, mobile apps, digital marketing and custom software in Pakistan, the UK and worldwide.': 'Prime Growth PK helps businesses grow through web development, SEO, AI automation, digital marketing and custom software in Pakistan, the UK and worldwide.',
              'Websites, SEO, AI automation, mobile apps, digital marketing and custom software built around practical business growth.': 'Websites, SEO, AI automation, digital marketing and custom software built around practical business growth.',
              'Prime Growth PK provides website development, AI automation, mobile app development, SEO, digital marketing and custom business software for organisations in Pakistan, the United Kingdom and international markets.': 'Prime Growth PK provides website development, AI automation, SEO, digital marketing and custom business software for organisations in Pakistan, the United Kingdom and international markets.',
              'Prime Growth PK helps businesses grow through web development, SEO, AI automation, mobile apps, digital marketing and custom software.': 'Prime Growth PK helps businesses grow through web development, SEO, AI automation, digital marketing and custom software.',
              'Prime Growth PK combines websites, SEO, AI automation, mobile apps, advertising and creative support into one practical growth partnership.': 'Prime Growth PK combines websites, SEO, AI automation, advertising and creative support into one practical growth partnership.',
              '<span class="capability-number">04</span><strong>Mobile Apps</strong>': '<span class="capability-number">04</span><strong>Custom Software</strong>',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          text = re.sub(r'<i></i><span>Mobile Apps</span>', '', text, count=1)
          text = re.sub(r'<article class="service-card blue-card">.*?<h3>Mobile App Development</h3>.*?</article>', '', text, count=1, flags=re.S)
          text = text.replace('<span class="card-index">05</span><div class="service-symbol" aria-hidden="true">Social</div>', '<span class="card-index">04</span><div class="service-symbol" aria-hidden="true">Social</div>')
          text = text.replace('<span class="card-index">06</span><div class="service-symbol" aria-hidden="true">SYS</div>', '<span class="card-index">05</span><div class="service-symbol" aria-hidden="true">SYS</div>')
          index.write_text(text, encoding='utf-8')

          services = root / 'services' / 'index.html'
          text = services.read_text(encoding='utf-8')
          replacements = {
              'Explore website development, AI automation, mobile apps, SEO, advertising, social media, branding, content and custom software services from Prime Growth PK.': 'Explore website development, AI automation, SEO, advertising, social media, branding, content, custom software and maintenance services from Prime Growth PK.',
              'Prime Growth PK provides website development, AI automation, mobile app development, SEO, paid advertising, social media marketing, branding, content, email marketing and custom business software for organisations in Pakistan, the United Kingdom and international markets.': 'Prime Growth PK provides website development, AI automation, SEO, paid advertising, social media marketing, branding, content, email marketing, website maintenance and custom business software for organisations in Pakistan, the United Kingdom and international markets.',
              'Choose focused support for your website, AI initiatives, mobile product, search visibility, advertising, brand, content or internal business processes.': 'Choose focused support for your website, AI initiatives, search visibility, advertising, brand, content or internal business processes.',
              'AI, mobile apps and custom software can extend the same customer experience into support and operations.': 'AI and custom software can extend the same customer experience into support and operations.',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          text = re.sub(r'<div class="card service-card reveal-item">(?:(?!<div class="card service-card reveal-item">).)*?<h3>Mobile App Development</h3>.*?</div>\s*(?=<div class="card service-card reveal-item">)', '', text, count=1, flags=re.S)
          text = text.replace('{"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Mobile App Development", "url": "https://primegrowthpk.com/mobile-app-development/"}}, ', '')
          text = text.replace('Mobile App Development\n', '')
          services.write_text(text, encoding='utf-8')

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-site-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services/index.html .github/workflows/one-time-site-audit.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "SEO: align homepage and services with current offering"
          git push
